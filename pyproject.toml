[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "requests",
    "python-dotenv",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
]

[tool.setuptools.packages.find]
where = ["src"]